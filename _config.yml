# ============================================================
# Site Configuration
# ============================================================
# Intended repository: zjusuge/zjusuge.github.io
# Intended homepage: https://zjusuge.github.io/
#
# If you edit this file while running `jekyll serve`,
# restart the local server.


# ============================================================
# Site Settings
# ============================================================

title: "Tianlong Wang"

description: "Physics-informed and explainable AI for geohazard forecasting across debris flows, landslides, hydrology and geotechnics."

repository: "zjusuge/zjusuge.github.io"

url: "https://zjusuge.github.io"
baseurl: ""

google_scholar_stats_use_cdn: true


# ============================================================
# Google Analytics
# ============================================================
# Keep this ID only if it belongs to your own Analytics property.

google_analytics_id: "G-E6WMVM4PZ0"


# ============================================================
# Search Engine Verification
# ============================================================
# Leave these values unset until you obtain your own codes.
# For HTML-tag verification, enter only the content value,
# not the complete <meta> tag.

google_site_verification:
bing_site_verification:
baidu_site_verification:


# ============================================================
# Site Author
# ============================================================

author:
  name: "Tianlong Wang"

  avatar: "/images/2.jpg"

  bio: "PhD Student, Zhejiang University | Joint Doctoral Research Training, NTU"

  location: "Singapore"

  email: "tianlong_wang@zju.edu.cn"

  uri: "https://zjusuge.github.io/"

  googlescholar: "https://scholar.google.com/citations?user=JNiHto0AAAAJ"

  researchgate: "https://www.researchgate.net/profile/Tianlong-Wang-7"

  orcid: "https://orcid.org/0000-0002-0598-5481"

  # Usernames only: the template adds the URL prefixes.
  github: "zjusuge"
  linkedin: "tianlong-wang"


# ============================================================
# Reading Files
# ============================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - server
  - scripts
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"

markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ============================================================
# Conversion
# ============================================================

markdown: kramdown
highlighter: rouge

lsi: false
excerpt_separator: "\n\n"
incremental: false


# ============================================================
# Markdown Processing
# ============================================================

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# ============================================================
# Default Page Settings
# ============================================================

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# ============================================================
# Sass / SCSS
# ============================================================

sass:
  sass_dir: _sass
  style: compressed


# ============================================================
# Output
# ============================================================

permalink: /:categories/:title/
collections:
  poems:
    output: true
timezone: Asia/Shanghai


# ============================================================
# Plugins
# ============================================================

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji


# ============================================================
# HTML Compression
# ============================================================

compress_html:
  clippings: all
  ignore:
    envs: development
