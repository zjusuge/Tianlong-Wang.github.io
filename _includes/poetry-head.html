<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title | escape }} · 苏格格调</title>
<meta name="description" content="{{ page.description | default: site.data.poetry.description | escape }}">
<meta name="theme-color" content="#f5f1e9">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website"><meta property="og:title" content="{{ page.title | escape }} · 苏格格调"><meta property="og:description" content="{{ page.description | default: site.data.poetry.description | escape }}">
<link rel="icon" href="{{ '/assets/poetry-mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/poetry.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/poetry-refinements.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/js/poetry.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% if site.data.poetry_music.enabled %}<link rel="stylesheet" href="{{ '/assets/css/poetry-music.css' | relative_url }}"><script src="{{ '/assets/js/poetry-music.js' | relative_url }}" defer></script>{% endif %}
