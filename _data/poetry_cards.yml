    雨初晴，风正好，柳色摇烟，樟叶新芽早。
    田父插秧溪畔笑，稚子追游，踏浪攀青草。
- poem: p-6c7d49ddf1
  excerpt: |-
    椰影映风柔，花影清香映水幽。
