    杯里微波摇月色，窗前薄雾覆云峰。
    何时共醉梅花下，共踏天涯寄远鸿。
- poem: p-fe37c3e8aa
  excerpt: |-
    四两拨云千钧力，孤帆破浪逐东流。
    星辰伴我离乡路，天际同瞻共一眸。
- poem: p-466b858c6b
  excerpt: |-
    巷底惊闻香未寒，街头犹忆故人茶。
    六年风雨人何在，一碗江城慰离怀。
- poem: p-c3e928803a
