    人间山水觅香踪，柴火轻烟绕翠峰。
    三味炉中惊舌梦，几杯醉里忆初衷。
- poem: p-07c0e6a076
  excerpt: |-
    酒醒书犹叠，诗成气未消。
    朝霞添逸兴，暮雨洗喧嚣。
- poem: p-cdae48e1a9
  excerpt: 杯斟往事情犹暖，席对新知意自明。
- poem: p-e290b8ee57
